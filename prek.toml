# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

fail_fast = true
default_install_hook_types = ["pre-commit", "pre-push", "commit-msg"]
default_stages = ["pre-commit"]

[update]
cooldown_days = 7
freeze = true

[[repos]]
repo = "builtin"
hooks = [
  { id = "check-added-large-files" },
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "check-merge-conflict" },
  { id = "mixed-line-ending", args = ["--fix=lf"] },
  { id = "detect-private-key" },
  { id = "check-json" },
  { id = "check-yaml" },
]

[[repos]]
repo = "https://github.com/commitizen-tools/commitizen"
rev = "57217c394fff5064bedd48421fe4b6f5f73aad47"  # frozen: v4.19.2
hooks = [
  { id = "commitizen" },
  { id = "commitizen-branch" },
]

[[repos]]
repo = "https://github.com/codespell-project/codespell"
rev = "57b21406f092110c18776e39b0bda50d37c945c8"  # frozen: v2.4.3
hooks = [
  { id = "codespell" },
]

[[repos]]
repo = "https://github.com/zizmorcore/zizmor-pre-commit"
rev = "fa412071e4f5d44d44f9e365f4676f9df92456a2"  # frozen: v1.30.1
hooks = [
  { id = "zizmor" },
]

[[repos]]
repo = "https://github.com/rvben/rumdl-pre-commit"
rev = "3429bee0c8870bff7874f898c6e8659d1ffe9645"  # frozen: v0.2.79
hooks = [
  { id = "rumdl", args = ["--fix"] },
]

[[repos]]
repo = "https://github.com/tombi-toml/tombi-pre-commit"
rev = "c96e08ac5fa1474f3ae716009539a6ed16267465"  # frozen: v1.8.1
hooks = [
  { id = "tombi-format" },
  { id = "tombi-lint" },
]

[[repos]]
repo = "https://github.com/astral-sh/uv-pre-commit"
rev = "2e145a365871c9fef3715d38b9b7393ce4174c85"  # frozen: 0.13.0
hooks = [
  { id = "uv-lock" },
]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "44b5042edab9382aba712eed4f9c7bab7a3d6a3e"  # frozen: v0.17.0
hooks = [
  { id = "ruff-check", args = ["--fix"] },
  { id = "ruff-format" },
]

[[repos]]
repo = "https://github.com/astral-sh/ty-pre-commit"
rev = "ded8634232ffc633dc66d44f1b0dfe2bdf766542"  # frozen: v0.0.86
hooks = [
  { id = "ty" },
]
